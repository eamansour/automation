#
# This workflow automates the "Bump to new version for development" process.
#
# REQUIRED SECRET:
# - GALASA_TEAM_GITHUB_TOKEN: A Personal Access Token (PAT) with permissions to:
#   - Push to branches in galasa, helm, simplatform, webui, integratedtests, isolated, and automation repositories
#   - Create pull requests in these repositories
#   - Read and write packages (for Docker operations)
#
# The token should have 'repo' and 'write:packages' scopes.
#

name: Bump Development Version

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'New development version (e.g., 0.42.0)'
        required: true
        type: string
      released_version:
        description: 'Version that was just released (e.g., 0.41.0)'
        required: true
        type: string
      branch_name:
        description: 'Branch name for version bump (e.g., version-bump-0.42.0)'
        required: true
        type: string
        default: 'version-bump'
  workflow_call:
    inputs:
      new_version:
        description: 'New development version (e.g., 0.42.0)'
        required: true
        type: string
      released_version:
        description: 'Version that was just released (e.g., 0.41.0)'
        required: true
        type: string
      branch_name:
        description: 'Branch name for version bump (e.g., version-bump-0.42.0)'
        required: true
        type: string
        default: 'version-bump'

env:
  # Set TERM to xterm-256color to fix errors in set-version scripts that use tput.
  # GitHub Actions doesn't set TERM by default, causing tput commands to fail.
  TERM: xterm-256color
  REGISTRY: ghcr.io

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.new_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: new_version must be in format X.Y.Z (e.g., 0.42.0)"
            exit 1
          fi
          if ! [[ "${{ inputs.released_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: released_version must be in format X.Y.Z (e.g., 0.41.0)"
            exit 1
          fi
          if [[ "${{ inputs.branch_name }}" == "release" ]]; then
            echo "Error: branch_name cannot be 'release'"
            exit 1
          fi

  bump-galasa:
    name: Bump Galasa version
    runs-on: ubuntu-latest
    needs: validate-inputs
    steps:
      - name: Checkout Galasa repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/galasa
          token: ${{ secrets.GALASA_TEAM_GITHUB_TOKEN }}
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'semeru'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.0.0
          cache-disabled: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Run set-version script
        run: |
          chmod +x ./tools/set-version.sh
          ./tools/set-version.sh --version ${{ inputs.new_version }}

      - name: Run build-locally script
        env:
          SOURCE_MAVEN: file:///home/runner/.m2/repository
        run: |
          chmod +x ./tools/build-locally.sh
          ./tools/build-locally.sh

      - name: Commit changes and create PR via GitHub API
        id: pr_url
        uses: actions/github-script@v7
        env:
          NEW_VERSION: ${{ inputs.new_version }}
          RELEASED_VERSION: ${{ inputs.released_version }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        with:
          github-token: ${{ secrets.GALASA_TEAM_GITHUB_TOKEN }}
          script: |
            const { NEW_VERSION, RELEASED_VERSION, BRANCH_NAME } = process.env;
            const owner = context.repo.owner;
            const repo = 'galasa';

            // Get the SHA of main
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const baseSha = ref.object.sha;

            // Delete branch if it exists, then recreate from main
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${BRANCH_NAME}` });
            } catch (e) {
              if (e.status !== 422) throw e;
            }
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${BRANCH_NAME}`, sha: baseSha });

            // Collect all changed files from the working tree
            const { execSync } = require('child_process');
            const changedFiles = execSync('git diff --name-only HEAD', { encoding: 'utf8' })
              .trim().split('\n').filter(Boolean);

            if (changedFiles.length === 0) {
              core.setFailed('No files were changed by the set-version script');
              return;
            }

            // Get the base commit's tree SHA
            const { data: baseCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: baseSha });
            const baseTreeSha = baseCommit.tree.sha;

            // Create a blob for each changed file and build the tree entries
            const fs = require('fs');
            const treeItems = [];
            for (const filePath of changedFiles) {
              const content = fs.readFileSync(filePath, { encoding: 'utf8' });
              const { data: blob } = await github.rest.git.createBlob({
                owner, repo,
                content: Buffer.from(content).toString('base64'),
                encoding: 'base64'
              });
              treeItems.push({ path: filePath, mode: '100644', type: 'blob', sha: blob.sha });
            }

            // Create a new tree based on the existing tree plus the changed files
            const { data: newTree } = await github.rest.git.createTree({
              owner, repo,
              base_tree: baseTreeSha,
              tree: treeItems
            });

            // Create the commit (GitHub API commits are signed/verified)
            const { data: newCommit } = await github.rest.git.createCommit({
              owner, repo,
              message: `Bump version to ${NEW_VERSION}`,
              tree: newTree.sha,
              parents: [baseSha]
            });

            // Update the branch to point at the new commit
            await github.rest.git.updateRef({
              owner, repo,
              ref: `heads/${BRANCH_NAME}`,
              sha: newCommit.sha
            });

            // Create the pull request
            const { data: pr } = await github.rest.pulls.create({
              owner, repo,
              title: `Bump version to ${NEW_VERSION}`,
              body: `Automated version bump from ${RELEASED_VERSION} to ${NEW_VERSION}`,
              head: BRANCH_NAME,
              base: 'main'
            });

            core.setOutput('pr_url', pr.html_url);
            console.log(`Galasa PR created: ${pr.html_url}`);

      - name: Upload Maven Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-artifacts
          path: /home/runner/.m2/repository/dev/galasa

    outputs:
      pr_url: ${{ steps.pr_url.outputs.pr_url }}

